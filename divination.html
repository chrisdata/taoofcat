<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄猫之道 · 傻猪占卜</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
  background: #f5f0e8;
  color: #2c2416;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2.5rem 1.25rem 4rem;
}

.container { width: 100%; max-width: 520px; }

.nav-back {
  display: inline-block;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  color: #9c8c6c;
  text-decoration: none;
  margin-bottom: 2rem;
  letter-spacing: 0.05em;
}
.nav-back:hover { color: #5c4c2c; }

.header { text-align: center; margin-bottom: 2.5rem; }

.brand-cat {
  font-size: 12px;
  letter-spacing: 0.4em;
  color: #9c8c6c;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
  margin-bottom: 10px;
}

.brand {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 0.25em;
  color: #2c2416;
  line-height: 1;
  margin-bottom: 8px;
}

.brand-divider {
  width: 60px;
  height: 1px;
  background: linear-gradient(to right, transparent, #9c8c6c, transparent);
  margin: 12px auto;
}

.brand-sub {
  font-size: 13px;
  color: #9c8c6c;
  letter-spacing: 0.12em;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
}

.can-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(255,255,255,0.6);
  border: 1px solid #d4c8a8;
  border-radius: 50px;
  padding: 9px 20px;
  margin-bottom: 2rem;
  font-size: 14px;
  color: #9c8c6c;
  font-family: 'Noto Sans SC', sans-serif;
}

.can-count { font-size: 16px; font-weight: 500; color: #2c2416; }

.buy-btn {
  font-size: 12px;
  font-family: 'Noto Sans SC', sans-serif;
  background: transparent;
  color: #7a6040;
  border: 1px solid #c4b48a;
  border-radius: 20px;
  padding: 3px 12px;
  cursor: pointer;
  margin-left: 4px;
  transition: all 0.2s;
}
.buy-btn:hover { background: #ede4d0; }

.card {
  background: rgba(255,255,255,0.7);
  border: 1px solid #d4c8a8;
  border-radius: 16px;
  padding: 1.75rem;
  margin-bottom: 1.25rem;
}

label {
  display: block;
  font-size: 13px;
  color: #9c8c6c;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  margin-top: 18px;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
}
label:first-child { margin-top: 0; }

input[type=text], textarea {
  width: 100%;
  background: rgba(255,255,255,0.9);
  border: 1px solid #d4c8a8;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 16px;
  color: #2c2416;
  font-family: 'Noto Serif SC', serif;
  outline: none;
  resize: none;
  transition: border-color 0.2s;
}
input[type=text]:focus, textarea:focus { border-color: #9c8c6c; }
textarea { height: 100px; line-height: 1.7; }

.div-btn {
  width: 100%;
  margin-top: 1.5rem;
  padding: 16px;
  font-size: 17px;
  font-weight: 500;
  font-family: 'Noto Serif SC', serif;
  letter-spacing: 0.15em;
  background: #2c2416;
  border: none;
  border-radius: 12px;
  color: #f5f0e8;
  cursor: pointer;
  transition: background 0.2s;
}
.div-btn:hover { background: #3d3220; }
.div-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.cost-note {
  font-size: 12px;
  color: #b4a880;
  text-align: center;
  margin-top: 10px;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
  letter-spacing: 0.05em;
}

.cat-stage {
  text-align: center;
  padding: 2.5rem 1rem;
  display: none;
}

.cat-name-label {
  font-size: 22px;
  font-weight: 500;
  color: #2c2416;
  letter-spacing: 0.3em;
  margin-bottom: 1.5rem;
}

.eye-row {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin: 1rem 0 1.5rem;
}

.eye {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  border: 2px solid #d4c8a8;
  transition: transform 0.7s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s;
}
.eye.closed { transform: scaleY(0.08); opacity: 0.25; }
.eye.open { transform: scaleY(1); opacity: 1; }
.eye-amber { background: #fdf3dc; }
.eye-blue { background: #e8f0fa; }

.thinking {
  font-size: 15px;
  color: #9c8c6c;
  min-height: 24px;
  letter-spacing: 0.1em;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
}

.result-wrap { display: none; }

.result-card {
  background: rgba(255,255,255,0.75);
  border: 1px solid #d4c8a8;
  border-radius: 16px;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}

.result-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(to right, transparent, #9c8c6c, transparent);
}

.gua-header {
  text-align: center;
  padding: 0.5rem 0 1.25rem;
}

.gua-sym {
  font-size: 72px;
  line-height: 1;
  margin-bottom: 12px;
  color: #2c2416;
}

.gua-name {
  font-size: 22px;
  font-weight: 500;
  color: #2c2416;
  letter-spacing: 0.15em;
}

.gua-nature {
  font-size: 13px;
  color: #9c8c6c;
  margin-top: 6px;
  letter-spacing: 0.1em;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 1.25rem 0;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
}
.divider::before { background: linear-gradient(to right, transparent, #d4c8a8); }
.divider::after { background: linear-gradient(to left, transparent, #d4c8a8); }
.divider-dot { width: 5px; height: 5px; border-radius: 50%; background: #b4a880; flex-shrink: 0; }

.quote-text {
  font-size: 20px;
  color: #2c2416;
  line-height: 1.8;
  text-align: center;
  letter-spacing: 0.12em;
  font-weight: 500;
}

.quote-src {
  font-size: 13px;
  color: #9c8c6c;
  text-align: center;
  margin-top: 8px;
  letter-spacing: 0.12em;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
}

.ai-loading {
  font-size: 14px;
  color: #9c8c6c;
  text-align: center;
  padding: 16px 0;
  letter-spacing: 0.1em;
  font-family: 'Noto Sans SC', sans-serif;
  display: none;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

.ai-resp {
  font-size: 17px;
  color: #3d3220;
  line-height: 2.1;
  white-space: pre-wrap;
  letter-spacing: 0.05em;
}

.share-row {
  display: flex;
  gap: 12px;
  margin-top: 1.5rem;
}

.share-btn {
  flex: 1;
  padding: 13px;
  font-size: 14px;
  font-family: 'Noto Sans SC', sans-serif;
  background: rgba(255,255,255,0.6);
  border: 1px solid #d4c8a8;
  border-radius: 10px;
  color: #7a6040;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 0.2s;
}
.share-btn:hover { background: rgba(255,255,255,0.95); color: #2c2416; }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(44,36,22,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.show { display: flex; }

.modal {
  background: #f5f0e8;
  border: 1px solid #d4c8a8;
  border-radius: 16px;
  padding: 2rem;
  width: 100%;
  max-width: 380px;
}

.modal-title {
  font-size: 20px;
  font-weight: 500;
  color: #2c2416;
  text-align: center;
  margin-bottom: 1.5rem;
  letter-spacing: 0.1em;
}

.pack {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #e8e0cc;
}
.pack:last-of-type { border-bottom: none; }
.pack-name { font-size: 15px; color: #3d3220; }
.pack-badge {
  font-size: 11px;
  color: #7a6040;
  background: #ede4d0;
  border-radius: 4px;
  padding: 1px 6px;
  margin-left: 6px;
  font-family: 'Noto Sans SC', sans-serif;
}
.pack-price { font-size: 15px; font-weight: 500; color: #5c7a3c; }
.pack-buy {
  font-size: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  padding: 6px 16px;
  background: transparent;
  border: 1px solid #c4b48a;
  border-radius: 20px;
  color: #7a6040;
  cursor: pointer;
  transition: all 0.2s;
}
.pack-buy:hover { background: #ede4d0; }

.modal-close {
  width: 100%;
  margin-top: 1.25rem;
  padding: 12px;
  background: transparent;
  border: 1px solid #d4c8a8;
  border-radius: 10px;
  color: #9c8c6c;
  cursor: pointer;
  font-size: 14px;
  font-family: 'Noto Sans SC', sans-serif;
  letter-spacing: 0.05em;
}
.modal-close:hover { color: #3d3220; }

@media (max-width: 480px) {
  body { padding: 1.5rem 1rem 3rem; }
  .brand { font-size: 30px; }
  .gua-sym { font-size: 60px; }
  .ai-resp { font-size: 16px; }
}
</style>
</head>
<body>

<div class="container">
  <a href="/" class="nav-back">← 返回玄猫之道</a>

  <div class="header">
    <div class="brand-cat">TAO OF YOUR CAT</div>
    <div class="brand">玄猫之道</div>
    <div class="brand-divider"></div>
    <div class="brand-sub">傻猪为你观天问卦 · 易经AI解读</div>
  </div>

  <div class="can-bar">
    <span style="font-size:18px;">🥫</span>
    <span>剩余罐头</span>
    <span class="can-count" id="can-count">3</span>
    <span>罐</span>
    <button class="buy-btn" onclick="document.getElementById('shop').classList.add('show')">＋ 补货</button>
  </div>

  <div class="card">
    <label for="cat-name">你的猫咪叫什么名字？</label>
    <input type="text" id="cat-name" placeholder="例如：傻猪、橘墩、小黑..." maxlength="10">
    <label for="question">你想请教傻猪什么？</label>
    <textarea id="question" placeholder="例如：我现在的方向对吗？要不要放弃现在的工作？这段感情值得继续吗？"></textarea>
    <button class="div-btn" id="div-btn" onclick="startDiv()">✦ 请傻猪占卜（消耗1罐罐头）</button>
    <div class="cost-note">新用户免费获得3罐 · 用完需补货才能继续</div>
  </div>

  <div class="cat-stage" id="cat-stage">
    <div class="cat-name-label" id="cat-name-label">傻 猪</div>
    <div class="eye-row">
      <div class="eye eye-amber closed" id="eye-l">🟤</div>
      <div class="eye eye-blue closed" id="eye-r">🔵</div>
    </div>
    <div class="thinking" id="thinking"></div>
  </div>

  <div class="result-wrap" id="result-wrap">
    <div class="result-card">
      <div class="gua-header">
        <div class="gua-sym" id="gua-sym"></div>
        <div class="gua-name" id="gua-name"></div>
        <div class="gua-nature" id="gua-nature"></div>
      </div>
      <div class="divider"><div class="divider-dot"></div></div>
      <div class="quote-text" id="quote-text"></div>
      <div class="quote-src" id="quote-src"></div>
      <div class="divider"><div class="divider-dot"></div></div>
      <div class="ai-loading" id="ai-loading">本猫正在细读天机...</div>
      <div class="ai-resp" id="ai-resp"></div>
    </div>
    <div class="share-row">
      <button class="share-btn" onclick="copyRes()">复制分享</button>
      <button class="share-btn" onclick="resetAll()">再问一次</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="shop">
  <div class="modal">
    <div class="modal-title">🥫 补充罐头</div>
    <div class="pack">
      <span class="pack-name">5罐 吞拿鱼</span>
      <span class="pack-price">$2.90</span>
      <button class="pack-buy" onclick="buyPack(5,this)">购买</button>
    </div>
    <div class="pack">
      <span class="pack-name">20罐 三文鱼<span class="pack-badge">热门</span></span>
      <span class="pack-price">$7.90</span>
      <button class="pack-buy" onclick="buyPack(20,this)">购买</button>
    </div>
    <div class="pack">
      <span class="pack-name">99罐 鲍鱼尊享</span>
      <span class="pack-price">$19.90</span>
      <button class="pack-buy" onclick="buyPack(99,this)">购买</button>
    </div>
    <button class="modal-close" onclick="document.getElementById('shop').classList.remove('show')">关闭</button>
  </div>
</div>

<script>
const API = 'https://web-production-907c5.up.railway.app';
const guas = [
  { name:"乾卦 · 天", sym:"☰", quote:"天行健，君子以自强不息", src:"《易经·乾》", nature:"刚健进取" },
  { name:"坤卦 · 地", sym:"☷", quote:"地势坤，君子以厚德载物", src:"《易经·坤》", nature:"包容承载" },
  { name:"屯卦 · 初生", sym:"䷂", quote:"信言不美，美言不信", src:"《道德经·八十一章》", nature:"艰难起步" },
  { name:"蒙卦 · 启蒙", sym:"䷃", quote:"为学日益，为道日损", src:"《道德经·四十八章》", nature:"去执求道" },
  { name:"需卦 · 等待", sym:"䷄", quote:"致虚极，守静笃", src:"《道德经·十六章》", nature:"守候时机" },
  { name:"讼卦 · 争", sym:"䷅", quote:"曲则全，枉则直", src:"《道德经·二十二章》", nature:"以柔克刚" },
  { name:"离卦 · 火", sym:"☲", quote:"应无所住，而生其心", src:"《金刚经》", nature:"放下执念" },
  { name:"艮卦 · 山", sym:"☶", quote:"知足者富", src:"《道德经·三十三章》", nature:"知足常乐" },
  { name:"巽卦 · 风", sym:"☴", quote:"上善若水，水善利万物而不争", src:"《道德经·八章》", nature:"顺势而为" },
  { name:"兑卦 · 泽", sym:"☱", quote:"信心清净，则生实相", src:"《金刚经》", nature:"喜悦开朗" },
  { name:"坎卦 · 水", sym:"☵", quote:"胜人者有力，自胜者强", src:"《道德经·三十三章》", nature:"险中求生" },
  { name:"震卦 · 雷", sym:"☳", quote:"为而不争，故天下莫能与之争", src:"《道德经·八十一章》", nature:"动而有节" },
];

let cans = parseInt(localStorage.getItem('taoofcat_cans') || '3');
let currentGua = null, currentCat = '', aiText = '';
function saveCans() { localStorage.setItem('taoofcat_cans', cans); }
document.getElementById('can-count').textContent = cans;

function startDiv() {
  const q = document.getElementById('question').value.trim();
  const cat = document.getElementById('cat-name').value.trim() || '傻猪';
  if (!q) { document.getElementById('question').focus(); return; }
  if (cans <= 0) { document.getElementById('shop').classList.add('show'); return; }
  cans--; saveCans();
  document.getElementById('can-count').textContent = cans;
  currentCat = cat;
  document.getElementById('div-btn').disabled = true;
  document.getElementById('result-wrap').style.display = 'none';
  document.getElementById('cat-stage').style.display = 'block';
  document.getElementById('cat-name-label').textContent = cat.split('').join(' ');
  document.getElementById('eye-l').className = 'eye eye-amber closed';
  document.getElementById('eye-r').className = 'eye eye-blue closed';
  document.getElementById('thinking').textContent = cat + ' 正在感应天机...';
  setTimeout(() => {
    document.getElementById('thinking').textContent = '异瞳缓缓睁开...';
    document.getElementById('eye-l').className = 'eye eye-amber open';
  }, 900);
  setTimeout(() => { document.getElementById('eye-r').className = 'eye eye-blue open'; }, 1400);
  setTimeout(() => {
    document.getElementById('thinking').textContent = '天机已现';
    const gua = guas[Math.floor(Math.random() * guas.length)];
    currentGua = gua;
    showResult(gua, q, cat);
  }, 2200);
}

function showResult(gua, q, cat) {
  document.getElementById('gua-sym').textContent = gua.sym;
  document.getElementById('gua-name').textContent = gua.name;
  document.getElementById('gua-nature').textContent = gua.nature;
  document.getElementById('quote-text').textContent = '「' + gua.quote + '」';
  document.getElementById('quote-src').textContent = gua.src;
  document.getElementById('ai-loading').style.display = 'block';
  document.getElementById('ai-resp').textContent = '';
  document.getElementById('result-wrap').style.display = 'block';
  aiText = '';
  callAPI(gua, q, cat);
  setTimeout(() => { document.getElementById('result-wrap').scrollIntoView({behavior:'smooth', block:'start'}); }, 300);
}

async function callAPI(gua, q, cat) {
  try {
    const res = await fetch(API + '/divination', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question:q, cat_name:cat, gua_name:gua.name, gua_nature:gua.nature, quote:gua.quote, quote_src:gua.src })
    });
    document.getElementById('ai-loading').style.display = 'none';
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const j = JSON.parse(data);
          if (j.text) { aiText += j.text; document.getElementById('ai-resp').textContent = aiText; }
        } catch(e) {}
      }
    }
  } catch(e) {
    document.getElementById('ai-loading').style.display = 'none';
    document.getElementById('ai-resp').textContent = '本猫今日天机受阻，请稍后再试。';
  }
}

function copyRes() {
  const text = '【玄猫之道 · ' + currentCat + '占卜结果】\n' + currentGua.name + ' · ' + currentGua.nature + '\n\n「' + currentGua.quote + '」\n' + currentGua.src + '\n\n' + aiText + '\n\n— taoofcat.com/divination.html';
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target.closest('button');
    const orig = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

function resetAll() {
  document.getElementById('result-wrap').style.display = 'none';
  document.getElementById('cat-stage').style.display = 'none';
  document.getElementById('div-btn').disabled = false;
  document.getElementById('question').value = '';
  window.scrollTo({top:0, behavior:'smooth'});
}

function buyPack(n, btn) {
  cans += n; saveCans();
  document.getElementById('can-count').textContent = cans;
  btn.textContent = '已加入 ✓';
  btn.disabled = true;
  setTimeout(() => { document.getElementById('shop').classList.remove('show'); }, 800);
}
</script>
</body>
</html>
