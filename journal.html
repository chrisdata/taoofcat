    :root {
      --bg: #1a1610;
      --paper: #f4ede0;

    body {

      font-family: 'Noto Sans SC', sans-serif;

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 40px;
      background: transparent;
      transition: background 0.3s, padding 0.3s;
    }
    nav.scrolled { background: var(--paper); padding: 14px 40px; }
    .nav-brand { text-decoration: none; }
    .nav-brand svg path, .nav-brand svg circle { fill: var(--paper); transition: fill 0.3s; }
    nav.scrolled .nav-brand svg path, nav.scrolled .nav-brand svg circle { fill: var(--ink) !important; }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a {
      text-decoration: none; font-size: 13px; letter-spacing: 0.12em;
      color: rgba(244,237,224,0.85); font-family: 'Noto Sans SC', sans-serif;
      font-weight: 300; transition: color 0.2s;
    }
    nav.scrolled .nav-links a { color: var(--ink); }
    .nav-links a:hover { color: var(--gold); }
    .lang-btn {
      font-size: 12px; font-family: 'Noto Sans SC', sans-serif;
      background: transparent; color: rgba(244,237,224,0.85);
      border: 1px solid rgba(244,237,224,0.35); border-radius: 20px;
      padding: 5px 14px; cursor: pointer; transition: all 0.2s;
      letter-spacing: 0.05em;
    }
    nav.scrolled .lang-btn { color: var(--ink); border-color: rgba(44,36,22,0.35); }
    @media(max-width:600px) {
      nav { padding: 16px 20px; }
      .nav-links { display: none; }
    }

    /* ── HERO ── */
    .hero {
      padding: 140px 40px 60px;
      text-align: center;
      border-bottom: 1px solid var(--ink-ghost);
    }
    .hero-label {
      font-size: 11px; letter-spacing: 0.5em; color: var(--gold-light);
      font-family: 'Noto Sans SC', sans-serif; font-weight: 300;
      margin-bottom: 20px; text-transform: uppercase;
    }
    .hero-title {
      font-size: clamp(28px, 5vw, 44px);
      font-family: 'Noto Serif SC', serif; font-weight: 400;
      color: var(--paper); letter-spacing: 0.15em; margin-bottom: 16px;
    }
    .hero-sub {
      font-size: 15px; color: rgba(244,237,224,0.55);
      letter-spacing: 0.08em; line-height: 2;
    }

    /* ── JOURNAL GRID ── */
    .journal-section {
      max-width: 860px; margin: 0 auto;
      padding: 60px 24px 100px;
    }
    .journal-empty {
      text-align: center; padding: 80px 0;
      color: rgba(244,237,224,0.3); font-size: 14px;
      letter-spacing: 0.1em; line-height: 2.5;
    }
    .journal-grid {
      display: flex; flex-direction: column; gap: 0;
    }
    .journal-card {
      display: flex; gap: 40px; align-items: flex-start;
      padding: 44px 0;
      border-bottom: 1px solid var(--ink-ghost);
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .journal-card.visible { opacity: 1; transform: translateY(0); }

    .card-date-col {
      flex: 0 0 80px; text-align: right; padding-top: 4px;
    }
    .card-year {
      font-size: 11px; letter-spacing: 0.2em;
      color: var(--gold-light); font-weight: 300; display: block;
    }
    .card-day {
      font-size: 28px; font-family: 'IM Fell English', serif;
      color: rgba(244,237,224,0.25); line-height: 1;
    }
    .card-month {
      font-size: 11px; letter-spacing: 0.15em;
      color: rgba(244,237,224,0.3); font-weight: 300;
    }

    .card-divider {
      flex: 0 0 1px; background: var(--ink-ghost);
      align-self: stretch; margin: 0 8px;
    }

    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: 13px; letter-spacing: 0.3em;
      color: var(--gold); font-weight: 300;
      margin-bottom: 14px; font-family: 'Noto Sans SC', sans-serif;
      text-transform: uppercase;
    }
    .card-content {
      font-size: 15px; line-height: 2.1;
      color: rgba(244,237,224,0.82);
      font-family: 'Noto Serif SC', serif; font-weight: 300;
      letter-spacing: 0.05em;
      white-space: pre-line;
    }
    .card-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 20px; font-size: 12px; letter-spacing: 0.15em;
      color: rgba(244,237,224,0.3); text-decoration: none;
      transition: color 0.2s; font-family: 'Noto Sans SC', sans-serif;
    }
    .card-link:hover { color: var(--gold); }
    .card-link svg { width: 12px; height: 12px; }

    /* ── ADMIN PANEL ── */
    .admin-toggle {
      position: fixed; bottom: 30px; right: 30px; z-index: 200;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(212,168,67,0.15); border: 1px solid var(--gold-light);
      color: var(--gold); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .admin-toggle:hover { background: rgba(212,168,67,0.25); }

    .admin-panel {
      position: fixed; bottom: 84px; right: 30px; z-index: 200;
      width: 340px; background: #211d15;
      border: 1px solid var(--gold-light); border-radius: 8px;
      padding: 24px; display: none;
    }
    .admin-panel.open { display: block; }
    .admin-panel h3 {
      font-size: 12px; letter-spacing: 0.3em; color: var(--gold);
      font-family: 'Noto Sans SC', sans-serif; font-weight: 300;
      margin-bottom: 16px; text-transform: uppercase;
    }
    .admin-field { margin-bottom: 12px; }
    .admin-field label {
      display: block; font-size: 11px; letter-spacing: 0.1em;
      color: rgba(244,237,224,0.4); margin-bottom: 6px;
    }
    .admin-field input,
    .admin-field textarea {
      width: 100%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(244,237,224,0.15); border-radius: 4px;
      color: var(--paper); font-size: 13px; padding: 8px 10px;
      font-family: 'Noto Sans SC', sans-serif; font-weight: 300;
      resize: vertical; outline: none;
      transition: border-color 0.2s;
    }
    .admin-field input:focus,
    .admin-field textarea:focus { border-color: var(--gold-light); }
    .admin-field textarea { min-height: 90px; }
    .admin-btn {
      width: 100%; padding: 10px; background: var(--gold);
      border: none; border-radius: 4px; color: var(--ink);
      font-size: 13px; letter-spacing: 0.1em; cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif; font-weight: 400;
      transition: opacity 0.2s; margin-top: 4px;
    }
    .admin-btn:hover { opacity: 0.85; }
    .admin-msg {
      font-size: 12px; text-align: center; margin-top: 10px;
      min-height: 18px; letter-spacing: 0.05em;
    }
    .admin-msg.ok { color: #7bc67e; }
    .admin-msg.err { color: #e07070; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--ink-ghost);
      padding: 32px 40px; text-align: center;
    }
    .footer-copy {
      font-size: 12px; color: rgba(244,237,224,0.25);
      letter-spacing: 0.15em;
    }
  </style>

<!-- ADMIN PANEL -->
<div class="admin-panel" id="admin-panel">
  <h3>精选管理</h3>
  <div class="admin-field">
    <label>密钥</label>
    <input type="password" id="a-secret" placeholder="ADMIN_SECRET">
  </div>
  <div class="admin-field">
    <label>Post ID（Threads 帖子 ID）</label>
    <input type="text" id="a-postid" placeholder="例：DJxxxxxx">
  </div>
  <div class="admin-field">
    <label>标题（选填，例：黑珠仔降临）</label>
    <input type="text" id="a-title" placeholder="留空也可以">
  </div>
  <div class="admin-field">
    <label>帖子内容（直接贴文字）</label>
    <textarea id="a-content" placeholder="把 Threads 帖子内容贴进来..."></textarea>
  </div>
  <div class="admin-field">
    <label>日期（例：2026.05.16）</label>
    <input type="text" id="a-date" placeholder="2026.05.16">
  </div>
  <button class="admin-btn" onclick="addPost()">✦ 加入精选</button>
  <div class="admin-msg" id="admin-msg"></div>
</div>

<footer>
  <div class="footer-copy">© 2026 玄猫之道</div>

<script>
const API = 'https://web-production-907c5.up.railway.app';
const MONTHS_EN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

// ── Language ──
let lang = localStorage.getItem('taoc_lang') || 'zh';
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-zh]').forEach(el => {
    const txt = lang === 'en' ? el.dataset.en : el.dataset.zh;
    if (txt !== undefined) el.innerHTML = txt;
  });
  document.getElementById('lang-btn').textContent = lang === 'zh' ? 'EN' : '中';
}
document.getElementById('lang-btn').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('taoc_lang', lang);
  applyLang();
});

// ── Nav scroll ──
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 60);
});

// ── Parse date ──
function parseDate(dateStr) {
  // 支持 2026.05.16 或 2026-05-16
  const parts = dateStr.replace(/-/g, '.').split('.');
  if (parts.length === 3) {
    return { year: parts[0], month: parseInt(parts[1]) - 1, day: parts[2] };
  }
  return { year: dateStr, month: -1, day: '' };
}

// ── Render cards ──
function renderCards(posts) {
  const grid = document.getElementById('journal-grid');
  const empty = document.getElementById('journal-empty');

  // clear existing cards
  grid.querySelectorAll('.journal-card').forEach(c => c.remove());

  if (!posts || posts.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  posts.forEach((post, i) => {
    const d = parseDate(post.date || '');
    const card = document.createElement('div');
    card.className = 'journal-card';
    card.dataset.postId = post.post_id;

    const monthEn = d.month >= 0 ? MONTHS_EN[d.month] : '';

    card.innerHTML = `
      <div class="card-date-col">
        <span class="card-year">${d.year}</span>
        <div class="card-day">${d.day}</div>
        <div class="card-month">${monthEn}</div>
      </div>
      <div class="card-divider"></div>
      <div class="card-body">
        ${post.title ? `<div class="card-title">${post.title}</div>` : ''}
        <div class="card-content">${post.content}</div>
        <a href="${post.threads_url}" target="_blank" rel="noopener" class="card-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span data-zh="在 Threads 查看" data-en="View on Threads">在 Threads 查看</span>
        </a>
      </div>
    `;
    grid.appendChild(card);

    // stagger fade in
    setTimeout(() => {
      card.classList.add('visible');
    }, i * 80);
  });

  applyLang();
}

// ── Load posts ──
async function loadPosts() {
  try {
    const res = await fetch(`${API}/journal`);
    const posts = await res.json();
    renderCards(posts);
  } catch(e) {
    console.error('Load error', e);
    document.getElementById('journal-empty').style.display = 'block';
  }
}

// ── Admin toggle ──
document.getElementById('admin-toggle').addEventListener('click', () => {
  document.getElementById('admin-panel').classList.toggle('open');
});

// ── Add post ──
async function addPost() {
  const secret = document.getElementById('a-secret').value.trim();
  const post_id = document.getElementById('a-postid').value.trim();
  const title = document.getElementById('a-title').value.trim();
  const content = document.getElementById('a-content').value.trim();
  const date = document.getElementById('a-date').value.trim();
  const msg = document.getElementById('admin-msg');

  if (!post_id || !content) {
    msg.className = 'admin-msg err';
    msg.textContent = 'Post ID 和内容不能为空';
    return;
  }

  try {
    const res = await fetch(`${API}/journal`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Admin-Secret': secret
      },
      body: JSON.stringify({ post_id, title, content, date })
    });
    const data = await res.json();
    if (res.ok) {
      msg.className = 'admin-msg ok';
      msg.textContent = `✦ 已加入，共 ${data.total} 条`;
      document.getElementById('a-postid').value = '';
      document.getElementById('a-title').value = '';
      document.getElementById('a-content').value = '';
      document.getElementById('a-date').value = '';
      loadPosts();
    } else {
      msg.className = 'admin-msg err';
      msg.textContent = data.error || '出错了';
    }
  } catch(e) {
    msg.className = 'admin-msg err';
    msg.textContent = '连接失败';
  }
}

// ── Init ──
loadPosts();
applyLang();
</script>
